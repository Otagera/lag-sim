name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      force_all:
        type: boolean
        description: 'Rebuild and deploy all services'
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-server.yml'
            stack:
              - 'client/**'
              - 'docker-compose.prod.yml'

  build-server:
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/lag-sim-server:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/lag-sim-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  deploy:
    # Server changes: deploy after the image is pushed.
    # Client/prod-compose-only changes: build-server is skipped, deploy anyway
    # (Coolify rebuilds the client and reuses the existing server image).
    needs: [changes, build-server]
    if: |
      always() && !failure() && !cancelled() && (
        needs.build-server.result == 'success' ||
        (needs.build-server.result == 'skipped' && needs.changes.outputs.stack == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          code=$(curl -sS -X POST -o resp.txt -w '%{http_code}' \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json")
          echo "Coolify responded HTTP $code"
          head -c 2000 resp.txt; echo
          [ "$code" -lt 400 ]
